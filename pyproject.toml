[project]
name = "context-forge"
version = "0.1.0"
description = "Repository context retrieval and evaluation for coding agents"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextforge*", "storage*"]

[tool.setuptools.package-data]
storage = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
